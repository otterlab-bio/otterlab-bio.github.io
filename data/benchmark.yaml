# Per-fraction means for the Xengsort comparison, generated from
# docs/benchmarks/xengsort-gradient-2026-11-24/results/per-fraction-mean-sd.csv in the
# manuscript repository. Do not edit by hand.
#
# Comparison basis follows the manuscript: OTTER is `modern`; RNA-seq uses Xengsort's
# `xengsort_graft` output checked against STAR, RRBS uses `bismark_replay` checked
# against Bismark.
#
# OTTER selects only pairs that also carry a qualifying human alignment, so its
# selection recall already equals usable recall. Xengsort makes graft calls before
# the alignment check, so both its raw and its usable recall and PPV are reported.

