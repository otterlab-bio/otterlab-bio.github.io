name: Build and deploy the OTTER homepage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.170.1"
      GO_VERSION: "1.24"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Go (required by Hugo Modules)
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve theme module
        run: hugo mod tidy

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          # configure-pages reports the custom domain over http on some runners,
          # which would put http URLs in every canonical tag and the sitemap.
          # Force https, since GitHub Pages serves this site over TLS only.
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE="${BASE/http:\/\//https://}"
          hugo --minify --baseURL "${BASE}/" --gc --panicOnWarning

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
