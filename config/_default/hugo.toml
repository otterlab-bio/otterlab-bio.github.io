# Hugo configuration. Theme assets come from the module; site assets (custom.css,
# scheme, fonts) come from this repository's assets/ directory.
# The site is served from a custom domain configured in the repository's Pages
# settings; CI overrides this with the value configure-pages reports.
baseURL = "https://otter.rainoffallingstar.com/"
title = "OTTER"
defaultContentLanguage = "en"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 40

# The site has no taxonomy content, so the empty /tags/ and /categories/ listing
# pages are disabled rather than published blank.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"
    [[module.imports.mounts]]
      source = "data"
      target = "data"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"
